name: Deploy Pages

on:
  push:
    branches:
      - "Edición-1"
      - "Edición-2"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Edición-1
        uses: actions/checkout@v4
        with:
          ref: "Edición-1"
          path: edicion-1

      - name: Checkout Edición-2
        uses: actions/checkout@v4
        with:
          ref: "Edición-2"
          path: edicion-2

      - name: Generar sitio único (Ed.1 en raíz + Ed.2 en /edicion-2/)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' edicion-1/ _site/
          rsync -a --exclude '.git' --exclude '.github' edicion-2/ _site/edicion-2/
          rm -rf _site/*.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
name: Deploy Pages

on:
  push:
    branches:
      - main
      - "Edición-1"
      - "Edición-2"
    paths:
      - "index.html"
      - "README.md"
      - "_config.yml"
      - "style.css"
      - "sketch_*.js"
      - "libraries/**"
      - "entrevistas/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub (main)
        uses: actions/checkout@v4
        with:
          ref: "main"
          path: hub

      - name: Checkout Edición-1
        uses: actions/checkout@v4
        with:
          ref: "Edición-1"
          path: edicion-1

      - name: Checkout Edición-2
        uses: actions/checkout@v4
        with:
          ref: "Edición-2"
          path: edicion-2

      - name: Generar sitio (hub en raíz + /edicion-1/ + /edicion-2/)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' hub/ _site/
          mkdir -p _site/edicion-1
          rsync -a --exclude '.git' --exclude '.github' edicion-1/ _site/edicion-1/
          mkdir -p _site/edicion-2
          rsync -a --exclude '.git' --exclude '.github' edicion-2/ _site/edicion-2/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La deriva del libro — índice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        color: #e2e2e2;
        font-family: "Share Tech Mono", monospace;
        position: relative;
        padding: 2rem;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
      }
      .wrapper {
        position: relative;
        z-index: 1;
        max-width: 500px;
        width: 100%;
      }
      h1 {
        font-family: "VT323", monospace;
        font-weight: 600;
        font-size: clamp(2.2rem, 7vw, 3rem);
        line-height: 1;
        letter-spacing: 0.02em;
        margin-bottom: 1rem;
        text-align: center;
        text-transform: uppercase;
      }
      .lead {
        color: #a5a5a5;
        font-weight: 300;
        margin-bottom: 3rem;
        max-width: 46ch;
        font-size: .9rem;
        line-height: 1.3rem;
        text-align: center;
        margin-left: auto;
        margin-right: auto;
      }
      .ediciones {
        display: grid;
        gap: 1rem;
      }
      a.card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid #e3e3e8;
        background: #fff;
        padding: 1.4rem 1.6rem;
        text-decoration: none;
        color: #111;
        transition: all 0.2s ease-in-out;
        border-radius: 6px;
      }
      a.card:hover,
      a.card:focus {
        background: #333;
        border-color: #333;
        color: #fff;
        transform: translateY(-2px);
      }
      .card .t {
        font-family: "VT323", monospace;
        text-transform: uppercase;
        font-weight: 400;
        font-size: 1.25rem;
      }
      .card .s {
        display: block;
        font-weight: 300;
        font-size: 0.88rem;
        opacity: 0.7;
        margin-top: 0.2rem;
      }
      .card .arrow {
        font-size: 1.4rem;
      }
      .foot {
        position: absolute;
        bottom: 1.4rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        color: #9a9aa2;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>La deriva del libro</h1>
      <p class="lead">
        Revista digital. Exploraciones sobre tecnologías editoriales, cultura
        digital y territorio
      </p>
      <nav class="ediciones">
        <a class="card" href="edicion-1/">
          <span
            ><span class="t">Edición 1</span>
            <span class="s">Grafo / El librobjeto</span></span
          >
          <span class="arrow">→</span>
        </a>
        <a class="card" href="edicion-2/">
          <span
            ><span class="t">Edición 2</span>
            <span class="s">Realidades expandidas — Próximamente</span></span
          >
          <span class="arrow">→</span>
        </a>
      </nav>
    </div>
    <div class="foot">Los Ojos, estudio tecnocreativo © 2022 – 2026</div>
  </body>
</html>
